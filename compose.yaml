services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SETUP_TOKEN: ${SETUP_TOKEN:?Set a random setup token}
      APP_ORIGIN: https://${DOMAIN:?Set your domain}
    volumes:
      # Mount thư mục data/ chứa SQLite database (nam-sach.sqlite) và tệp upload ra ngoài máy chủ
      - ./data:/data
  https:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
volumes:
  caddy_data:
