services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3080"
    # Keep a loopback port for an existing host Nginx/Apache proxy.
    # Public HTTPS traffic should go through Caddy below.
    ports:
      - "127.0.0.1:${HOST_PORT:-8208}:3080"
    environment:
      NODE_ENV: production
      PORT: 3080
      DATA_DIR: /data
      SETUP_TOKEN: ${SETUP_TOKEN:?Set a random setup token in .env}
      APP_ORIGIN: ${APP_ORIGIN:-https://${DOMAIN:?Set DOMAIN in .env}}
    volumes:
      - ./data:/data

  https:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
